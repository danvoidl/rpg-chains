# Render Blueprint (docs/deploy-plan.md §6): production from `main`, staging from `develop`. The
# database is external (Neon, one branch per environment) and media is Cloudflare R2 (one bucket
# per environment). Battles live in memory, so each service must stay ONE instance. Values marked
# `sync: false` are filled in the dashboard; nothing secret lives here.
services:
  - type: web
    name: rpg-chains
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    numInstances: 1
    # Deploys only after the GitHub CI is green.
    autoDeployTrigger: checksPass
    # A failed migration aborts the deploy and leaves the running version up.
    preDeployCommand: pnpm --filter @rpg-chains/server exec prisma migrate deploy
    # Room for the API's preClose to finish writing the battle journal.
    maxShutdownDelaySeconds: 60
    envVars:
      - key: MIGRATE_ON_BOOT
        value: 'false'
      # Caddy listens here; the API and the web stay on inner ports (deploy/start.sh).
      - key: PORT
        value: '10000'
      # The app's public URL (https://app.<domain>). The web bundle inlines it at build time —
      # changing it takes a new deploy, not a restart; auth and the socket check it at runtime.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Neon `production` branch, direct (non-pooled) connection string with sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Cloudflare R2: https://<account-id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: rpg-chains-media
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      # The bucket's custom domain (https://media.<domain>), no trailing slash.
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: MEDIA_MAX_UPLOAD_BYTES
        value: '5242880'
      - key: MEDIA_MAX_VIDEO_BYTES
        value: '52428800'
      # Upload quotas: 1 GB per user, 100 uploads per user per 24 h, 8 GB in all (R2's free tier
      # is 10 GB). The total is the ceiling no number of accounts gets past.
      - key: MEDIA_USER_QUOTA_BYTES
        value: '1073741824'
      - key: MEDIA_USER_DAILY_UPLOADS
        value: '100'
      - key: MEDIA_TOTAL_QUOTA_BYTES
        value: '8589934592'
      # Auth emails through Resend; EMAIL_FROM on the domain verified there, e.g.
      # "rpg-chains <nao-responda@<domain>>".
      - key: EMAIL_TRANSPORT
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Cloudflare Turnstile on sign-up, sign-in and password reset. The site key is public and
      # inlined into the web bundle at build time; the secret stays on the server.
      - key: CAPTCHA_PROVIDER
        value: turnstile
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

  # Free plan: sleeps after 15 min and has no preDeployCommand, so it migrates on boot.
  - type: web
    name: rpg-chains-staging
    runtime: docker
    plan: free
    region: virginia
    branch: develop
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: MIGRATE_ON_BOOT
        value: 'true'
      - key: PORT
        value: '10000'
      # https://staging.<domain>
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Neon `staging` branch.
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: rpg-chains-media-staging
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      # https://media-staging.<domain>
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: MEDIA_MAX_UPLOAD_BYTES
        value: '5242880'
      - key: MEDIA_MAX_VIDEO_BYTES
        value: '52428800'
      # Upload quotas: 1 GB per user, 100 uploads per user per 24 h, 8 GB in all (R2's free tier
      # is 10 GB). The total is the ceiling no number of accounts gets past.
      - key: MEDIA_USER_QUOTA_BYTES
        value: '1073741824'
      - key: MEDIA_USER_DAILY_UPLOADS
        value: '100'
      - key: MEDIA_TOTAL_QUOTA_BYTES
        value: '8589934592'
      # Auth emails through Resend; EMAIL_FROM on the domain verified there, e.g.
      # "rpg-chains <nao-responda@<domain>>".
      - key: EMAIL_TRANSPORT
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Cloudflare Turnstile on sign-up, sign-in and password reset. The site key is public and
      # inlined into the web bundle at build time; the secret stays on the server.
      - key: CAPTCHA_PROVIDER
        value: turnstile
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
